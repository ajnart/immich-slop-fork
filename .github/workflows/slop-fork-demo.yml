name: Slop fork browser demo

on:
  push:
    branches: ['slop-fork/raw-companions']
    paths:
      - '.github/workflows/slop-fork-demo.yml'
      - '.github/scripts/slop-fork-browser-demo.mjs'
  workflow_dispatch:
    inputs:
      image:
        description: Published immutable server image digest
        required: true
        default: ghcr.io/ajnart/immich-slop-fork@sha256:68bce1cc5e7be960d580265f396c53b0e92d1b1f13d4d720fcaf468799ed0856
        type: string

permissions: {}

concurrency:
  group: slop-fork-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-demo:
    if: github.repository == 'ajnart/immich-slop-fork'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SLOP_IMAGE: ${{ inputs.image || 'ghcr.io/ajnart/immich-slop-fork@sha256:68bce1cc5e7be960d580265f396c53b0e92d1b1f13d4d720fcaf468799ed0856' }}
      IMMICH_DEMO_OUTPUT: ${{ github.workspace }}/slop-fork-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
      - name: Configure transient demo state
        run: echo "IMMICH_SMOKE_STATE_PATH=$RUNNER_TEMP/slop-fork-smoke-state.json" >> "$GITHUB_ENV"
      - name: Install browser and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libimage-exiftool-perl ffmpeg
          npm install --global agent-browser@0.41.2
          agent-browser install --with-deps
          agent-browser --version
      - name: Pull published image and start disposable stack
        run: |
          [[ "$SLOP_IMAGE" =~ ^ghcr.io/ajnart/immich-slop-fork@sha256:[a-f0-9]{64}$ ]]
          docker compose -f .github/slop-fork-smoke.yml pull
          docker image inspect "$SLOP_IMAGE" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/slop-demo-image.json"
          docker compose -f .github/slop-fork-smoke.yml up --detach --wait --wait-timeout 300
          docker inspect "$(docker compose -f .github/slop-fork-smoke.yml ps -q immich-server)" --format '{{json .Config.Env}}' | jq --exit-status 'all(.[]; startswith("IMMICH_RAW_COMPANIONS=") | not)'
          curl --fail --silent --show-error http://127.0.0.1:2283/api/server/ping | jq -e '.res == "pong"'
      - name: Import genuine RAF and JPEG companions
        run: |
          export IMMICH_SMOKE_RAW_PATH="$RUNNER_TEMP/slop-demo-X100V.RAF"
          curl --fail --silent --show-error --retry 3 'https://raw.pixls.us/getfile.php/3812/nice/Fujifilm%20-%20X100V%20-%2014bit%2014bit%20compressed%20(3%3A2).RAF' --output "$IMMICH_SMOKE_RAW_PATH"
          echo "48f2055ab497c687347eee84103d4f48deb016fff711d2810eaf1317e506f621  $IMMICH_SMOKE_RAW_PATH" | sha256sum --check
          node .github/scripts/slop-fork-import-smoke.mjs
      - name: Verify persistent restart with existing imported assets
        run: |
          docker compose -f .github/slop-fork-smoke.yml down
          docker compose -f .github/slop-fork-smoke.yml up --detach --wait --wait-timeout 300
          docker inspect "$(docker compose -f .github/slop-fork-smoke.yml ps -q immich-server)" --format '{{json .Config.Env}}' | jq --exit-status 'all(.[]; startswith("IMMICH_RAW_COMPANIONS=") | not)'
          curl --fail --silent --show-error http://127.0.0.1:2283/api/server/ping | jq -e '.res == "pong"'
          echo "IMMICH_DEMO_DEFAULT_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Exercise desktop and responsive mobile web with agent-browser
        run: node .github/scripts/slop-fork-browser-demo.mjs
      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slop-fork-browser-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: slop-fork-demo/
          retention-days: 30
          if-no-files-found: warn
      - name: Remove credentials and disposable stack
        if: always()
        run: |
          rm -f "$IMMICH_SMOKE_STATE_PATH"
          docker compose -f .github/slop-fork-smoke.yml down --volumes --remove-orphans
