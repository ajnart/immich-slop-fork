name: slop-fork-smoke

services:
  immich-server:
    image: ${SLOP_IMAGE:?Set SLOP_IMAGE to the built image}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: smoke
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      IMMICH_RAW_COMPANIONS:
    volumes:
      - smoke-media:/data
    ports:
      - '127.0.0.1:${SLOP_PORT:-2283}:2283'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    volumes:
      - smoke-db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: smoke
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  smoke-media:
  smoke-db:
